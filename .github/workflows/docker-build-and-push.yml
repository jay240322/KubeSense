name: Build, Push and Update GitOps

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build-and-push:
    if: github.actor != 'github-actions[bot]'

    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Image Tag
        id: vars
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "image_tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ---------------- Backend ----------------

      - name: Build Backend Image
        run: |
          docker build \
            -t joypatel2403/kubesense-backend:${IMAGE_TAG} \
            -t joypatel2403/kubesense-backend:latest \
            ./backend

      - name: Push Backend Image
        run: |
          docker push joypatel2403/kubesense-backend:${IMAGE_TAG}
          docker push joypatel2403/kubesense-backend:latest

      # ---------------- Frontend ----------------

      - name: Build Frontend Image
        run: |
          docker build \
            -t joypatel2403/kubesense-frontend:${IMAGE_TAG} \
            -t joypatel2403/kubesense-frontend:latest \
            ./frontend

      - name: Push Frontend Image
        run: |
          docker push joypatel2403/kubesense-frontend:${IMAGE_TAG}
          docker push joypatel2403/kubesense-frontend:latest

  update-gitops:
    if: github.actor != 'github-actions[bot]'

    needs: build-and-push

    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: develop

      - name: Update Kustomize Image Tags
        run: |
          sed -i "/joypatel2403\/kubesense-backend/{n;s/newTag:.*/newTag: \"${IMAGE_TAG}\"/;}" k8s/overlays/dev/kustomization.yaml

          sed -i "/joypatel2403\/kubesense-frontend/{n;s/newTag:.*/newTag: \"${IMAGE_TAG}\"/;}" k8s/overlays/dev/kustomization.yaml

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/overlays/dev/kustomization.yaml

          git diff --cached --quiet || git commit -m "chore(gitops): update image tags to ${IMAGE_TAG}"

      - name: Push Changes
        run: |
          git push origin HEAD:develop