# Source: postgres-pvc.yaml
---
apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: postgres-pvc
  namespace: kubesense

spec:
  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      storage: 5Gi

# Source: postgres-deployment.yaml
---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: postgres
  namespace: kubesense

spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:
        - name: postgres
          image: postgres:17

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data

      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc

# Source: postgres-service.yaml
---
apiVersion: v1
kind: Service

metadata:
  name: postgres-service
  namespace: kubesense

spec:
  selector:
    app: postgres

  ports:
    - port: 5432
      targetPort: 5432

  type: ClusterIP

# Source: backend-service.yaml
---
apiVersion: v1
kind: Service

metadata:
  name: kubesense-backend-service
  namespace: kubesense

spec:
  selector:
    app: kubesense-backend

  ports: 
    - protocol: TCP
      port: 8000
      targetPort: 8000

  type: ClusterIP

# Source: backend-deployment.yaml
---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: kubesense-backend
  namespace: kubesense

spec:
  replicas: 1

  selector:
    matchLabels:
      app: kubesense-backend

  template:
    metadata:
      labels:
        app: kubesense-backend

    spec:
      serviceAccountName: kubesense-backend

      containers:
        - name: backend

          image: joypatel2403/kubesense-backend:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8000

          env:

            # Gemini Configuration

            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kubesense-secret
                  key: GOOGLE_API_KEY

            - name: GEMINI_MODEL
              valueFrom:
                configMapKeyRef:
                  name: kubesense-config
                  key: GEMINI_MODEL

            # PostgreSQL Configuration

            - name: POSTGRES_HOST
              value: postgres-service

            - name: POSTGRES_PORT
              value: "5432"

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

            # KubeSense Authentication

            - name: KUBESENSE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kubesense-auth
                  key: KUBESENSE_USERNAME

            - name: KUBESENSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kubesense-auth
                  key: KUBESENSE_PASSWORD

