# Source: service-account.yaml
---
apiVersion: v1
kind: ServiceAccount

metadata:
  name: kubesense-backend
  namespace: kubesense

# Source: role.yaml
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole

metadata:
  name: kubesense-backend-role

rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - events
      - namespaces
    verbs:
      - get
      - list
      - watch

# Source: role-binding.yaml
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding

metadata:
  name: kubesense-backend-rolebinding

subjects:
  - kind: ServiceAccount
    name: kubesense-backend
    namespace: kubesense

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubesense-backend-role

# Source: configmap.yaml
---
apiVersion: v1
kind: ConfigMap

metadata:
  name: kubesense-config
  namespace: kubesense

data:
  GEMINI_MODEL: "gemini-3.1-flash-lite"
  BACKEND_PORT: "8000"
  FRONTEND_PORT: "3000"

# Source: secret.yaml
