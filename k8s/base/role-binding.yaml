apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding

metadata:
  name: kubesense-backend-rolebinding

subjects:
  - kind: ServiceAccount
    name: kubesense-backend
    namespace: kubesense

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubesense-backend-role