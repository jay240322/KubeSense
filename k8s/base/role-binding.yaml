apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding

metadata:
  name: kubesense-backend-rolebinding
  namespace: kubesense

subjects:
  - kind: ServiceAccount
    name: kubesense-backend
    namespace: kubesense

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubesense-backend-role